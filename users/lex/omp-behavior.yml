# Managed omp behaviour, passed with `--config` by users/lex/omp.nix.
# These keys win over ~/.config/omp/agent/config.yml. That file is not managed
# by the repo: it holds only what the user owns by hand (model roles, and
# whatever omp writes itself). Do NOT add modelRoles or retry.fallbackChains
# here; they would shadow the manual settings.
personality: pragmatic
extendedContext: true
checkpoint:
  enabled: true
plan:
  autosave: true
  autosaveDir: ~/.config/omp/agent/plans
compaction:
  # Share of the model window, not a fixed token count: a fixed 400k trigger
  # clamped to contextWindow - 1, so 400k models only compacted at the edge.
  # GLM-5.3-Flash starts emitting degenerate reasoning around 154k, so 35%
  # compacts a 400k model at 140k while 1M models still reach 350k.
  thresholdPercent: 35
  idleEnabled: true
  handoffSaveToDisk: true
  methodOrder:
    - shake
    - soft
    - handoff
memory:
  backend: mnemopi
mnemopi:
  # One isolated bank per working directory.
  scoping: per-project
advisor:
  syncBacklog: "3"
prewalk:
  enabled: false
task:
  enableLsp: true
  maxRecursionDepth: 3
  showResolvedModelBadge: true
  crossInstance: true
  maxRuntimeMs: 3600000
  eager: preferred
features:
  unexpectedStopDetection: smart
tools:
  xdevDocs: builtins
astGrep:
  enabled: true
retry:
  waitForUsageReset: true
  # No silent rerouting: a failing/limited model errors instead of moving to
  # another provider. usageAwareFallback moves between accounts/models before
  # a hard limit; modelFallback switches to fallbackChains entries.
  modelFallback: false
  usageAwareFallback: false
gc:
  compress: true
  autoCompress: true
error:
  notify: "on"
recap:
  enabled: false
# The binary is pinned by the flake; updates come through nix.
startup:
  checkUpdate: false
dev:
  autoqa: false
disabledProviders:
  - glm-local
