# Visual settings for omp, passed with `--config` by users/lex/omp.nix.
# These keys win over ~/.config/omp/agent/config.yml; behaviour lives in
# omp-behavior.yml. Needs omp >= 18.4.3.
theme:
  dark: dark-catppuccin
  light: light-catppuccin
symbolPreset: nerd
composer:
  shape: claude
  tokenRate: true
statusLine:
  preset: custom
  separator: powerline
  transparent: true
  showHookStatus: false
  compactThinkingLevel: false
  leftSegments:
    - pi
    - vim
    - hostname
    - model
    - status
    - mode
    - path
    - git
    - pr
    - session
    - subagents
  rightSegments:
    - session_name
    - token_in
    - token_out
    - cache_read
    - cache_write
    - token_rate
    - cost
    - context_pct
    - context_total
    - time_spent
    - time
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 60
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
    time:
      format: 24h
      showSeconds: true
terminal:
  showProgress: false
tui:
  textSizing: true
  codexResetFireworks: true
  tight: true
display:
  shimmer: disabled
  showTokenUsage: true
  showTurnTime: true
  cacheMissMarker: true
read:
  renderMarkdown: true
  toolResultPreview: true
readLineNumbers: true
emojiAutocomplete: false
