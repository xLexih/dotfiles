# OMP look overlay, loaded via `omp --config` (see overlay/omp-look.nix).
#
# Ported from the Downloads/agent bundle's config.yml (visual keys only).
# Merges over ~/.omp/agent/config.yml at runtime; the live file keeps owning
# modelRoles, memory, and all other logic, and stays user-mutable.
#
# Floor: omp 18.0.8 (pinned in overlay/omp-18.0.8.nix). Two source keys are
# omitted because this binary's schema does not know them yet
# (`omp config list` has no entry; re-add after the pin moves past 18.2):
#   composer.tokenRate, read.readLineNumbers
# `personality` is deliberately excluded: behavioral, not look
# (live config uses `pragmatic`, source used `none`).
theme:
  dark: dark-catppuccin
  light: light-catppuccin
symbolPreset: nerd
composer:
  shape: claude
statusLine:
  preset: custom
  separator: powerline
  transparent: true
  showHookStatus: false
  leftSegments:
    - pi
    - vim
    - hostname
    - model
    - status
    - mode
    - path
    - git
    - pr
    - session
    - subagents
  rightSegments:
    - session_name
    - token_in
    - token_out
    - cache_read
    - cache_write
    - token_rate
    - cost
    - context_pct
    - context_total
    - time_spent
    - time
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 60
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
    time:
      format: 24h
      showSeconds: true
terminal:
  # Source bundle enables this; we don't want the top progress bar.
  showProgress: false
tui:
  textSizing: true
  codexResetFireworks: true
  tight: true
display:
  shimmer: disabled
  showTokenUsage: true
  showTurnTime: true
  cacheMissMarker: true
read:
  renderMarkdown: true
  toolResultPreview: true
emojiAutocomplete: false
